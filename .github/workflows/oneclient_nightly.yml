name: RustCraft Nightly (Unsigned)


on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: oneclient-nightly-${{ github.ref }}
  cancel-in-progress: true

# Nightlies are unsigned test builds, so they do not need the release profile's
# whole-program optimization - and that optimization is exactly what makes them
# slow. `lto = "fat"` + `codegen-units = 1` force a single-threaded re-optimization
# of the entire dependency graph at link time, on every run, which no cache can
# ever skip. Thin LTO keeps nearly all of the runtime benefit at a fraction of the
# link cost, and 16 codegen units lets the whole compile use every runner core.
#
# These are cargo's documented profile overrides, so `target/release` stays the
# output directory and every path below is unaffected. The shipped release binary
# is untouched: oneclient_release.yml still builds the fat-LTO profile from
# Cargo.toml. That difference is why the two workflows must not share a cache
# namespace - see `cache-namespace` on the Setup Rust step.
env:
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ''
            os_key: windows
            arch: x86_64
            formats: nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
          save-cache: true
          restore-cache: true
          # Separate namespace: nightly's thin-LTO dependency artifacts have
          # different cargo fingerprints than the release workflow's fat-LTO ones,
          # so a shared cache would just thrash between the two.
          cache-namespace: nightly-cache

      - name: Install cargo-packager
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-packager
          version: 0.11.8

      - name: Build release binary
        shell: bash
        run: cargo build --release --bin oneclient_app

      - name: Stage app-local VC++ runtime
        shell: bash
        run: python3 distribution/windows/bundle-crt.py

      - name: Verify staged runtime is Microsoft-signed
        shell: pwsh
        run: |
          $dlls = @(Get-ChildItem 'target/crt/*.dll')
          if ($dlls.Count -eq 0) { Write-Error 'no CRT DLLs staged'; exit 1 }
          foreach ($dll in $dlls) {
            $sig = Get-AuthenticodeSignature $dll.FullName
            Write-Host "$($dll.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              Write-Error "$($dll.Name) signature is $($sig.Status), refusing to ship it"
              exit 1
            }
            if ($sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              Write-Error "$($dll.Name) is not signed by Microsoft"
              exit 1
            }
          }

      - name: Package (unsigned)
        shell: bash
        env:
          CI: 'true'
        run: cargo packager --release --formats ${{ matrix.formats }} --verbose

      - name: Resolve packager output dir
        id: outdir
        shell: bash
        run: echo "dir=target/release" >> "$GITHUB_OUTPUT"

      - name: Smoke-test installer layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'C:\oneclient-smoke'
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          $exe = Resolve-Path (Get-ChildItem '${{ steps.outdir.outputs.dir }}/*-setup.exe')[0].FullName
          # NSIS: /S is silent, /D= sets the install dir and must be the last arg.
          $p = Start-Process -FilePath $exe -ArgumentList '/S', "/D=$dest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installer exited $($p.ExitCode)"; exit 1 }

          Write-Host '--- installed layout ---'
          Get-ChildItem -Recurse $dest | ForEach-Object { Write-Host $_.FullName }

          if (-not (Test-Path "$dest\oneclient_app.exe")) {
            Write-Error "oneclient_app.exe is not at the root of $dest"
            exit 1
          }
          foreach ($dll in @(Get-ChildItem 'target/crt/*.dll')) {
            if (-not (Test-Path (Join-Path $dest $dll.Name))) {
              Write-Error "$($dll.Name) did not land beside oneclient_app.exe - cargo-packager put resources elsewhere, so app-local CRT loading will not work"
              exit 1
            }
          }
          Write-Host "OK: $($(Get-ChildItem 'target/crt/*.dll').Count) CRT DLLs sit beside oneclient_app.exe"

      # Upload debug info (.pdb produced by the release profile's
      # split-debuginfo) to Sentry so nightly crash reports get real file/function/
      # line stack traces instead of raw addresses. Runs on every main push, so
      # each unique build's symbols land in Sentry (matched by debug-id). Skips
      # silently unless SENTRY_AUTH_TOKEN secret + SENTRY_ORG/SENTRY_PROJECT vars
      # are configured.
      - name: Upload debug symbols to Sentry
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          OUT_DIR: ${{ steps.outdir.outputs.dir }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ] || [ -z "${SENTRY_ORG:-}" ] || [ -z "${SENTRY_PROJECT:-}" ]; then
            echo "Sentry credentials not configured (need SENTRY_AUTH_TOKEN secret + SENTRY_ORG/SENTRY_PROJECT vars); skipping debug-symbol upload."
            exit 0
          fi
          curl -sL https://sentry.io/get-cli/ | bash
          export PATH="/usr/local/bin:$PATH"
          SYMS="$(mktemp -d)"
          shopt -s nullglob
          for f in "$OUT_DIR"/oneclient_app.exe "$OUT_DIR"/oneclient_app.pdb; do
            [ -e "$f" ] || continue
            cp -R "$f" "$SYMS/"
          done
          sentry-cli debug-files upload --include-sources "$SYMS"

      - name: Collect executable
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          # Raw executable, renamed per platform so the unzipped uploads don't collide.
          bin="${{ steps.outdir.outputs.dir }}/oneclient_app"
          ext=""
          [ -e "$bin.exe" ] && ext=".exe"
          cp "$bin$ext" "dist/oneclient_app-${{ matrix.os_key }}-${{ matrix.arch }}$ext"
          ls -la dist

      - name: Upload unsigned executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/oneclient_app-${{ matrix.os_key }}-${{ matrix.arch }}*
          archive: false
          if-no-files-found: error
          retention-days: 14
