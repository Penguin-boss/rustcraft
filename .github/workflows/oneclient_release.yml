name: RustCraft Release Build


on:
  workflow_dispatch:

# NOTE: CARGO_PACKAGER_SIGN_PRIVATE_KEY* are deliberately NOT declared at
# workflow level. Swatinem/rust-cache folds every `CARGO*`-prefixed environment
# variable into its cache key, so a workflow-level declaration gave this workflow
# a cache namespace that the nightly workflow could never populate - every
# release built the whole dependency graph from scratch. They are scoped to the
# individual steps that actually need them instead.

concurrency:
  group: oneclient-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Knope finds the commit (and so the PR author) that added each change file
          fetch-depth: 0

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          restore-cache: false

      - name: Install Knope
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: knope
          version: 0.23.0

      - name: Consume changesets
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          read_version() {
            sed -n -E '/^\[workspace\.package\]/,/^\[/ s/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1
          }

          # No change files means a re-run of a release whose version commit
          # already landed, so carry on with the current version.
          RELEASED=0
          if compgen -G ".changeset/*.md" > /dev/null; then
            knope prepare-release
            cargo update --workspace --offline || cargo update --workspace
            RELEASED=1
          fi

          VERSION="$(read_version)"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from [workspace.package] in Cargo.toml"
            exit 1
          fi
          TAG="oneclient-$VERSION"
          echo "Releasing RustCraft $VERSION"

          # Abort rather than clobber: a published release (or an existing tag,
          # which only appears once a release is published) means this version
          # already shipped. A *draft* is a previous failed/partial run of this
          # same workflow, so reuse it.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on origin - RustCraft $VERSION has already been released. Add a change file with \`knope document-change\` first."
            exit 1
          fi

          RELEASE_EXISTS=0
          IS_DRAFT=""
          if IS_DRAFT="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)"; then
            RELEASE_EXISTS=1
          fi
          if [ "$RELEASE_EXISTS" = "1" ] && [ "$IS_DRAFT" != "true" ]; then
            echo "::error::Release $TAG already exists and is published - refusing to overwrite RustCraft $VERSION. Add a change file with \`knope document-change\` first."
            exit 1
          fi

          # Commit only after the guards pass, so a rejected release does not
          # leave a stray version bump on the branch.
          if [ "$RELEASED" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A Cargo.toml Cargo.lock .changeset CHANGELOG.md
            git commit -m "chore: release $VERSION"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          SHA="$(git rev-parse HEAD)"

          if [ "$RELEASE_EXISTS" = "1" ]; then
            echo "Reusing existing draft release $TAG"
            gh release edit "$TAG" --target "$SHA"
          else
            # The body is what the launcher's changelog page shows
            awk -v heading="## $VERSION " '/^## /{p = index($0, heading) == 1; next} p' \
              CHANGELOG.md > notes.md 2>/dev/null || true
            if ! grep -q '[^[:space:]]' notes.md; then
              echo "::error::No changelog entry for $VERSION. Add a change file with \`knope document-change\` first."
              exit 1
            fi
            gh release create "$TAG" \
              --draft \
              --target "$SHA" \
              --title "RustCraft $VERSION" \
              --notes-file notes.md
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  package:
    needs: prepare
    permissions:
      contents: write
      # Required so SignPath can download the uploaded build artifact.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: ''
            os_key: windows
            arch: x86_64
            formats: nsis

    runs-on: ${{ matrix.platform }}
    steps:
      # Pin to the commit `prepare` resolved - after a release that is the version
      # commit it just pushed, which github.sha would not point at.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
          save-cache: true
          restore-cache: true

      - name: Install cargo-packager
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-packager
          version: 0.11.8

      - name: Build release binary
        shell: bash
        run: cargo build --release --bin oneclient_app

      - name: Upload unsigned app binary artifact
        id: win_upload_unsigned_bin
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oneclient-windows-binary-unsigned
          path: target/release/oneclient_app.exe

      - name: Submit SignPath signing request for app binary
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: onelauncher
          signing-policy-slug: release-signing
          artifact-configuration-slug: onelauncher-binary
          github-artifact-id: ${{ steps.win_upload_unsigned_bin.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-bin

      - name: Swap in signed app binary
        shell: bash
        run: |
          set -euo pipefail
          signed="signed-bin/oneclient_app.exe"
          if [ ! -e "$signed" ]; then
            echo "::error::SignPath did not return signed-bin/oneclient_app.exe"
            ls -R signed-bin || true
            exit 1
          fi
          cp "$signed" target/release/oneclient_app.exe

      - name: Verify app binary is signed
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature 'target/release/oneclient_app.exe'
          Write-Host "Authenticode status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -eq 'NotSigned') {
            Write-Error 'oneclient_app.exe carries no Authenticode signature'
            exit 1
          }

      - name: Stage app-local VC++ runtime
        shell: bash
        run: python3 distribution/windows/bundle-crt.py

      - name: Verify staged runtime is Microsoft-signed
        shell: pwsh
        run: |
          $dlls = @(Get-ChildItem 'target/crt/*.dll')
          if ($dlls.Count -eq 0) { Write-Error 'no CRT DLLs staged'; exit 1 }
          foreach ($dll in $dlls) {
            $sig = Get-AuthenticodeSignature $dll.FullName
            Write-Host "$($dll.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              Write-Error "$($dll.Name) signature is $($sig.Status), refusing to ship it"
              exit 1
            }
            if ($sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              Write-Error "$($dll.Name) is not signed by Microsoft"
              exit 1
            }
          }

      - name: Package
        shell: bash
        env:
          CI: 'true'
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: cargo packager --release --formats ${{ matrix.formats }} --verbose

      - name: Resolve packager output dir
        id: outdir
        shell: bash
        run: echo "dir=target/release" >> "$GITHUB_OUTPUT"

      # Upload debug info (.pdb produced by the release profile's
      # split-debuginfo) to Sentry so crash reports get real file/function/line
      # stack traces instead of raw addresses. Skips silently unless the repo has
      # a SENTRY_AUTH_TOKEN secret plus SENTRY_ORG / SENTRY_PROJECT variables.
      - name: Upload debug symbols to Sentry
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          OUT_DIR: ${{ steps.outdir.outputs.dir }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ] || [ -z "${SENTRY_ORG:-}" ] || [ -z "${SENTRY_PROJECT:-}" ]; then
            echo "Sentry credentials not configured (need SENTRY_AUTH_TOKEN secret + SENTRY_ORG/SENTRY_PROJECT vars); skipping debug-symbol upload."
            exit 0
          fi
          curl -sL https://sentry.io/get-cli/ | bash
          export PATH="/usr/local/bin:$PATH"
          SYMS="$(mktemp -d)"
          shopt -s nullglob
          for f in "$OUT_DIR"/oneclient_app.exe "$OUT_DIR"/oneclient_app.pdb; do
            [ -e "$f" ] || continue
            cp -R "$f" "$SYMS/"
          done
          sentry-cli debug-files upload --include-sources "$SYMS"

      - name: Locate installer
        id: win_installer
        shell: bash
        run: echo "path=$(ls ${{ steps.outdir.outputs.dir }}/*-setup.exe | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Smoke-test installer layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'C:\oneclient-smoke'
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          $exe = Resolve-Path '${{ steps.win_installer.outputs.path }}'
          # NSIS: /S is silent, /D= sets the install dir and must be the last arg.
          $p = Start-Process -FilePath $exe -ArgumentList '/S', "/D=$dest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installer exited $($p.ExitCode)"; exit 1 }

          Write-Host '--- installed layout ---'
          Get-ChildItem -Recurse $dest | ForEach-Object { Write-Host $_.FullName }

          if (-not (Test-Path "$dest\oneclient_app.exe")) {
            Write-Error "oneclient_app.exe is not at the root of $dest"
            exit 1
          }
          foreach ($dll in @(Get-ChildItem 'target/crt/*.dll')) {
            if (-not (Test-Path (Join-Path $dest $dll.Name))) {
              Write-Error "$($dll.Name) did not land beside oneclient_app.exe - cargo-packager put resources elsewhere, so app-local CRT loading will not work"
              exit 1
            }
          }
          Write-Host "OK: $($(Get-ChildItem 'target/crt/*.dll').Count) CRT DLLs sit beside oneclient_app.exe"

      - name: Upload unsigned installer artifact
        id: win_upload_unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oneclient-windows-installer-unsigned
          path: ${{ steps.win_installer.outputs.path }}

      - name: Submit SignPath signing request
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: onelauncher
          signing-policy-slug: release-signing
          artifact-configuration-slug: onelauncher-installer
          github-artifact-id: ${{ steps.win_upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace installer with signed one + recompute updater sig
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          signed="$(ls signed/*-setup.exe | head -n1)"
          # Overwrite the unsigned installer in the packager out dir with the signed exe.
          cp "$signed" "${{ steps.win_installer.outputs.path }}"
          # Recompute the updater signature over the SIGNED exe.
          cargo packager signer sign \
            --private-key "$CARGO_PACKAGER_SIGN_PRIVATE_KEY" \
            --password "$CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD" \
            "${{ steps.win_installer.outputs.path }}"

      - name: Upload installers and build manifest fragment
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          OUT_DIR: ${{ steps.outdir.outputs.dir }}
          OS_KEY: ${{ matrix.os_key }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Identify the single updater artifact (the NSIS installer with a sibling
          # .sig). NOTE: nullglob is on, so an unmatched glob expands to nothing. Use
          # arrays rather than `ls <glob> | head` - the latter falls back to listing
          # the cwd when nothing matches, silently picking an unrelated file.
          matches=("$OUT_DIR"/*-setup.exe)
          updater_file="${matches[0]:-}"
          if [ -z "$updater_file" ]; then
            echo "::error::No installer found in $OUT_DIR"
            exit 1
          fi

          unique="OneClient_${VERSION}_${OS_KEY}_${ARCH}.exe"
          cp "$updater_file" "$OUT_DIR/$unique"
          cp "$updater_file.sig" "$OUT_DIR/$unique.sig"

          # Upload the signed installer plus the renamed updater bundle and its .sig.
          for f in "$OUT_DIR"/*-setup.exe "$OUT_DIR/$unique" "$OUT_DIR/$unique.sig"; do
            [ -e "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber
          done

          base="$unique"
          mkdir -p fragments
          SIG="$(cat "$updater_file.sig")" \
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${base}" \
          FMT="nsis" \
          KEYS="${OS_KEY}-${ARCH}" \
          FRAG_NAME="${OS_KEY}-${ARCH}" \
          python3 - <<'PY'
          import json, os
          entry = {
            "signature": os.environ["SIG"],
            "url": os.environ["URL"],
            "format": os.environ["FMT"],
          }
          frag = {key: entry for key in os.environ["KEYS"].split()}
          with open(f"fragments/{os.environ['FRAG_NAME']}.json", "w") as f:
              json.dump(frag, f)
          PY

      - name: Upload manifest fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifest-${{ matrix.os_key }}-${{ matrix.arch }}
          path: fragments/*.json

  manifest:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all manifest fragments
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: manifest-*
          path: fragments
          merge-multiple: true

      - name: Assemble latest.json
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, glob, os, datetime
          platforms = {}
          for path in glob.glob("fragments/*.json"):
              with open(path) as f:
                  platforms.update(json.load(f))
          manifest = {
              "version": os.environ["VERSION"],
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload latest.json to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
